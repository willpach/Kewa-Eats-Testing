<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kewa Eats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EE;
    --card:#FFFDF8;
    --ink:#2B221B;
    --ink-soft:#6B5D4F;
    --clay:#B54A34;
    --clay-soft:#E9C9BF;
    --turquoise:#3D7A74;
    --ochre:#D6A23C;
    --line:#E4DAC8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:24px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--clay);}
  .tagline{
    font-size:0.95rem;
    color:var(--ink-soft);
    margin:0;
    max-width:280px;
    text-align:right;
  }
  nav.views{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  nav.views button{
    font-family:'Karla',sans-serif;
    font-size:0.9rem;
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.views button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .nav-row .period{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.3rem;
  }
  .nav-row .controls{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .nav-row button.step{
    width:34px;height:34px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-size:1rem;
    cursor:pointer;
    color:var(--ink);
  }
  .nav-row button.today{
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    padding:0 14px;
    height:34px;
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    color:var(--ink-soft);
  }

  /* MONTH VIEW */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .dow{
    font-size:0.75rem;
    font-weight:600;
    color:var(--ink-soft);
    text-align:left;
    padding:4px 6px;
  }
  .day-cell{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    min-height:78px;
    padding:8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color .15s ease;
  }
  .day-cell:hover{border-color:var(--clay);}
  .day-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .day-cell.today{border-color:var(--turquoise);border-width:2px;}
  .day-num{font-size:0.85rem;font-weight:600;color:var(--ink-soft);}
  .day-cell.today .day-num{color:var(--turquoise);}
  .badge{
    align-self:flex-start;
    background:var(--clay-soft);
    color:var(--clay);
    font-size:0.72rem;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
  }

  /* WEEK VIEW */
  .week-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
  }
  .week-col{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:10px;
    min-height:140px;
  }
  .week-col-head{
    font-size:0.75rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .week-col-head .num{color:var(--ink);font-size:0.95rem;}
  .week-col.today{border-color:var(--turquoise);border-width:2px;}
  .mini-card{
    font-size:0.78rem;
    padding:6px 8px;
    background:var(--bg);
    border-radius:7px;
    margin-bottom:6px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .mini-card .mini-name{font-weight:700;display:block;}

  /* DAY VIEW / LISTINGS */
  .listings{display:flex;flex-direction:column;gap:12px;}
  .empty-state{
    color:var(--ink-soft);
    font-style:italic;
    padding:30px 0;
    text-align:center;
  }
  .vendor-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
  }
  .vendor-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .vendor-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 4px;
  }
  .vendor-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0;
  }
  .vendor-sub b{color:var(--ink);font-weight:600;}
  .chip{
    font-size:0.72rem;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .chip.pickup{background:#E4EDE9;color:var(--turquoise);}
  .chip.delivery{background:#FBEEDD;color:var(--ochre);}
  .chip.both{background:var(--clay-soft);color:var(--clay);}
  .vendor-details{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:none;
    font-size:0.9rem;
    line-height:1.55;
  }
  .vendor-card.open .vendor-details{display:block;}
  .detail-row{margin-bottom:10px;}
  .detail-label{
    font-weight:700;
    color:var(--ink);
    display:block;
    margin-bottom:2px;
    font-size:0.8rem;
  }
  .menu-list{margin:0;padding:0;list-style:none;}
  .menu-list li{
    display:flex;
    justify-content:space-between;
    padding:3px 0;
    border-bottom:1px dotted var(--line);
  }
  .menu-list li:last-child{border-bottom:none;}
  .contact-note{
    color:var(--ink-soft);
    font-style:italic;
    font-size:0.85rem;
  }
  .view{display:none;}
  .view.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kewa <span>Eats</span></h1>
    <p class="tagline">See who's selling food this week — click a day to browse.</p>
  </header>

  <nav class="views">
    <button data-view="month" class="active">Month</button>
    <button data-view="week">Week</button>
    <button data-view="day">Day</button>
  </nav>

  <div class="nav-row">
    <div class="period" id="periodLabel"></div>
    <div class="controls">
      <button class="step" id="prevBtn">‹</button>
      <button class="today" id="todayBtn">Today</button>
      <button class="step" id="nextBtn">›</button>
    </div>
  </div>

  <div class="view active" id="view-month">
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="view" id="view-week">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <div class="view" id="view-day">
    <div class="listings" id="dayListings"></div>
  </div>
</div>

<script>
/* ---------- DUMMY DATA (stand-in for Google Sheet rows) ---------- */
/* Each row mirrors a real form submission. Swap SALES with data
   fetched/parsed from the published Google Sheet CSV later. */

const SALES = [
  {
    vendor: "Anacita's Kitchen",
    items: ["Posole w/frybread $10", "Indian tacos $8", "Frito pie $6", "Frybread burgers $10", "Burgers $6", "Cheese fries $6", "Red chili cheese fries $7"],
    date: "2026-09-10",
    time: "11:30am, order ahead by text",
    fulfillment: "pickup",
    location: "104 Kingman Street",
    payment: "Exact cash, CashApp $Chavez0008, FB Pay (Anacita Bailon), credit/debit cards",
    contactPublic: true,
    contact: "Text or call (505) 948-1834"
  },
  {
    vendor: "Ohana Refreshments",
    items: ["Hamburger combo w/ fries + drink $10", "Cheeseburger combo w/ fries + drink $10", "24oz Lemonade $5", "Dirty Soda 24oz $7", "Mango Chai Tea $7"],
    date: "2026-09-10",
    time: "11:30am, while supplies last",
    fulfillment: "pickup",
    location: "111 Ysleta Del Sur Street (Harvey & Jaine Chavez residence)",
    payment: "Cash, CashApp $RaelynAmber23",
    contactPublic: true,
    contact: "Call or text (505) 231-7653 or (505) 933-0645"
  },
  {
    vendor: "Aguilar Shave Ice",
    items: ["Shave ice, mixed flavors $4"],
    date: "2026-09-11",
    time: "Open til sundown",
    fulfillment: "pickup",
    location: "North of the community center",
    payment: "Cash",
    contactPublic: false,
    contact: ""
  },
  {
    vendor: "Sno Cups & Picadillys",
    items: ["Sno cup $1 / $3 / $4 (by size)", "Picadillys $5"],
    date: "2026-09-11",
    time: "Closing at sundown",
    fulfillment: "pickup",
    location: "See OPEN sign on door",
    payment: "Cash",
    contactPublic: false,
    contact: ""
  },
  {
    vendor: "TrahpehKewa Burritos",
    items: ["Carne burritos $8", "Green chili burritos $8", "Potato, ground beef & green chili burritos", "Dessert $4"],
    date: "2026-09-12",
    time: "Morning, then heading up to Santa Fe",
    fulfillment: "delivery",
    location: "Delivering around Kewa, then Santa Fe",
    payment: "Cash",
    contactPublic: true,
    contact: "Message before heading up"
  },
  {
    vendor: "Nambe St. Sweets",
    items: ["SPAM burritos", "Popcorn ball", "Rice crispy treat"],
    date: "2026-09-12",
    time: "Morning — leaving for the parade at 6:45am",
    fulfillment: "pickup",
    location: "Nambe St, House #128",
    payment: "Cash",
    contactPublic: false,
    contact: ""
  },
  {
    vendor: "132 Tano Sweets",
    items: ["Stuffed sopas $6", "Caramel apples, plain $5", "Caramel apples w/ pecans $6"],
    date: "2026-09-13",
    time: "12pm–4pm",
    fulfillment: "pickup",
    location: "132 Tano Street",
    payment: "Cash, Apple Pay & Zelle (no fee), CashApp & cards (small fee)",
    contactPublic: false,
    contact: ""
  },
  {
    vendor: "Anacita's Kitchen",
    items: ["Frito pie $6", "Cheeseburgers $7", "Fries $5"],
    date: "2026-09-17",
    time: "11am–2pm",
    fulfillment: "both",
    location: "104 Kingman Street, or delivery within village",
    payment: "Cash, CashApp $Chavez0008",
    contactPublic: true,
    contact: "Text or call (505) 948-1834"
  },
  {
    vendor: "Ohana Refreshments",
    items: ["Dirty Energy Drink 24oz $8", "Berry Cheesecake Burst $7", "Mango Dragon Fruit Refresher $7"],
    date: "2026-09-19",
    time: "12pm, til we run out!",
    fulfillment: "pickup",
    location: "111 Ysleta Del Sur Street",
    payment: "Cash, CashApp $RaelynAmber23",
    contactPublic: true,
    contact: "Call or text (505) 231-7653"
  }
];

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2,'0');
const fmtKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const salesByDate = {};
SALES.forEach(s => { (salesByDate[s.date] = salesByDate[s.date] || []).push(s); });

const today = new Date();
today.setHours(0,0,0,0);

let currentView = 'month';
let cursor = new Date(today); // drives whichever view is active
let selectedDay = new Date(today);

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const dowShort = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- rendering ---------- */
function fulfillmentChip(f){
  if(f === 'pickup') return '<span class="chip pickup">Pickup</span>';
  if(f === 'delivery') return '<span class="chip delivery">Delivery</span>';
  return '<span class="chip both">Pickup or delivery</span>';
}

function vendorCard(sale, forceOpen){
  const menu = sale.items.map(i => {
    const m = i.match(/^(.*?)(\$\d+(\.\d+)?)$/);
    if(m) return `<li><span>${m[1].trim()}</span><span>${m[2]}</span></li>`;
    return `<li><span>${i}</span></li>`;
  }).join('');

  const contactBlock = sale.contactPublic
    ? `<div class="detail-row"><span class="detail-label">Contact</span>${sale.contact}</div>`
    : `<div class="detail-row"><span class="detail-label">Contact</span><span class="contact-note">Kept private by vendor — check back or look for their posted flyer.</span></div>`;

  return `
    <div class="vendor-card${forceOpen ? ' open' : ''}">
      <div class="vendor-card-top">
        <div>
          <p class="vendor-name">${sale.vendor}</p>
          <p class="vendor-sub"><b>${sale.time}</b></p>
        </div>
        ${fulfillmentChip(sale.fulfillment)}
      </div>
      <div class="vendor-details">
        <div class="detail-row">
          <span class="detail-label">Menu</span>
          <ul class="menu-list">${menu}</ul>
        </div>
        <div class="detail-row"><span class="detail-label">Location</span>${sale.location}</div>
        <div class="detail-row"><span class="detail-label">Payment</span>${sale.payment}</div>
        ${contactBlock}
      </div>
    </div>`;
}

function attachCardToggles(root){
  root.querySelectorAll('.vendor-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('open'));
  });
}

function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $('#periodLabel').textContent = `${monthNames[m]} ${y}`;
  const grid = $('#monthGrid');
  grid.innerHTML = dowShort.map(d=>`<div class="dow">${d}</div>`).join('');

  const firstDay = new Date(y, m, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    grid.innerHTML += `<div class="day-cell empty"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,m,d);
    const key = fmtKey(dateObj);
    const isToday = key === fmtKey(today);
    const count = (salesByDate[key]||[]).length;
    grid.innerHTML += `
      <div class="day-cell${isToday?' today':''}" data-date="${key}">
        <span class="day-num">${d}</span>
        ${count ? `<span class="badge">${count} selling</span>` : ''}
      </div>`;
  }

  grid.querySelectorAll('.day-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedDay = new Date(cell.dataset.date + 'T00:00:00');
      cursor = new Date(selectedDay);
      setView('day');
    });
  });
}

function startOfWeek(d){
  const s = new Date(d);
  s.setDate(s.getDate() - s.getDay());
  return s;
}

function renderWeek(){
  const start = startOfWeek(cursor);
  const end = new Date(start); end.setDate(end.getDate()+6);
  $('#periodLabel').textContent = `${monthNames[start.getMonth()]} ${start.getDate()} – ${monthNames[end.getMonth()]} ${end.getDate()}`;

  const grid = $('#weekGrid');
  grid.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = fmtKey(d);
    const isToday = key === fmtKey(today);
    const daySales = salesByDate[key] || [];
    const cards = daySales.map(s=>`
      <div class="mini-card" data-date="${key}">
        <span class="mini-name">${s.vendor}</span>
        ${s.items[0]}${s.items.length>1?' +more':''}
      </div>`).join('');
    grid.innerHTML += `
      <div class="week-col${isToday?' today':''}">
        <div class="week-col-head">${dowShort[i]}<br><span class="num">${d.getDate()}</span></div>
        ${cards || ''}
      </div>`;
  }

  grid.querySelectorAll('.mini-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      selectedDay = new Date(card.dataset.date + 'T00:00:00');
      cursor = new Date(selectedDay);
      setView('day');
    });
  });
}

function renderDay(){
  const key = fmtKey(selectedDay);
  const isToday = key === fmtKey(today);
  $('#periodLabel').textContent = `${dowShort[selectedDay.getDay()]}, ${monthNames[selectedDay.getMonth()]} ${selectedDay.getDate()}${isToday ? ' · Today' : ''}`;

  const daySales = salesByDate[key] || [];
  const container = $('#dayListings');
  if(!daySales.length){
    container.innerHTML = `<div class="empty-state">No food sales posted for this day yet.</div>`;
    return;
  }
  container.innerHTML = daySales.map(s=>vendorCard(s,false)).join('');
  attachCardToggles(container);
}

function render(){
  if(currentView==='month') renderMonth();
  if(currentView==='week') renderWeek();
  if(currentView==='day') renderDay();
}

function setView(v){
  currentView = v;
  document.querySelectorAll('nav.views button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  render();
}

/* ---------- nav controls ---------- */
document.querySelectorAll('nav.views button').forEach(btn=>{
  btn.addEventListener('click', ()=> setView(btn.dataset.view));
});

$('#prevBtn').addEventListener('click', ()=>{
  if(currentView==='month') cursor.setMonth(cursor.getMonth()-1);
  if(currentView==='week') cursor.setDate(cursor.getDate()-7);
  if(currentView==='day'){ selectedDay.setDate(selectedDay.getDate()-1); cursor = new Date(selectedDay); }
  render();
});
$('#nextBtn').addEventListener('click', ()=>{
  if(currentView==='month') cursor.setMonth(cursor.getMonth()+1);
  if(currentView==='week') cursor.setDate(cursor.getDate()+7);
  if(currentView==='day'){ selectedDay.setDate(selectedDay.getDate()+1); cursor = new Date(selectedDay); }
  render();
});
$('#todayBtn').addEventListener('click', ()=>{
  cursor = new Date(today);
  selectedDay = new Date(today);
  render();
});

render();
</script>
</body>
</html>
